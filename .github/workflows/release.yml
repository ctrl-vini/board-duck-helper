name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish GitHub release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches APP_VERSION
        run: |
          if ! grep -q "^APP_VERSION = \"${TAG#v}\"$" app/main.py; then
            echo "::error::Tag $TAG does not match APP_VERSION in app/main.py"
            exit 1
          fi

      - name: Build source archive
        run: git archive --format=zip --prefix="duckoder/" --output="duckoder-$TAG.zip" "$TAG"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$TAG" "duckoder-$TAG.zip"
          --title "Duckoder $TAG"
          --generate-notes
          --verify-tag
