<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Duckoder</title>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/app.css" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <header class="status-bar">
      <span class="status-bar__session">duckoder</span>
      <label class="board-field">
        <span data-text="boardLabel"></span>
        <select id="board-select" class="board-field__select"></select>
      </label>
      <div class="status-bar__actions">
        <button type="button" id="clear-conversation" class="terminal-button" data-shortcut="l">
          <span data-text="clearConversation"></span>
        </button>
        <button
          type="button"
          id="show-board"
          class="terminal-button"
          data-shortcut="p"
          aria-controls="board-pane"
          aria-expanded="false"
        >
          <span data-text="showBoard"></span>
        </button>
      </div>
      <button
        type="button"
        id="show-about"
        class="terminal-button status-bar__about"
        data-shortcut="s"
      >
        <span data-text="about"></span>
      </button>
    </header>

    <!-- Split like a terminal: the conversation, and the board pane beside it when open. -->
    <div class="panes">
      <div class="pane pane--conversation">
        <main class="workspace">
          <div class="transcript" id="transcript">
            <section class="motd" id="motd"></section>
            <ol class="lines" id="lines" aria-live="polite"></ol>
          </div>
          <aside class="duck" id="duck" data-mood="listening"></aside>
        </main>

        <form class="prompt" id="prompt-form">
          <div class="prompt__line">
            <span class="prompt__label" id="prompt-label" aria-hidden="true"></span>
            <label class="visually-hidden" for="request" data-text="requestLabel"></label>
            <textarea id="request" class="prompt__input" rows="1" maxlength="4000"></textarea>
          </div>
          <div class="prompt__actions">
            <span class="prompt__hint" data-text="sendHint"></span>
            <button
              type="submit"
              id="send"
              class="terminal-button terminal-button--accent"
              data-text="send"
            ></button>
          </div>
        </form>
      </div>

      <section class="pane pane--board" id="board-pane" hidden>
        <div class="pane__header">
          <p class="pane__command" id="board-pane-command"></p>
          <button type="button" id="close-board" class="terminal-button" data-text="close"></button>
        </div>
        <div class="pane__body" id="board-pane-body"></div>
      </section>
    </div>

    <dialog class="dialog" id="clear-dialog" aria-labelledby="clear-dialog-title">
      <form method="dialog" class="dialog__form">
        <p class="dialog__title" id="clear-dialog-title" data-text="clearDialogTitle"></p>
        <p data-text="clearDialogMessage"></p>
        <div class="dialog__actions">
          <span class="dialog__hint" data-text="clearDialogHint"></span>
          <button value="cancel" class="terminal-button" data-text="cancel"></button>
          <button
            value="confirm"
            class="terminal-button terminal-button--accent"
            data-text="clear"
            autofocus
          ></button>
        </div>
      </form>
    </dialog>

    <dialog class="dialog dialog--about" id="about-dialog" aria-labelledby="about-dialog-title">
      <form method="dialog" class="dialog__form">
        <div class="about" id="about-content"></div>
        <div class="dialog__actions">
          <button
            value="close"
            class="terminal-button terminal-button--accent"
            data-text="close"
            autofocus
          ></button>
        </div>
      </form>
    </dialog>
  </body>
</html>
