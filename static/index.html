<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Duckoder</title>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/app.css" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <header class="status-bar">
      <span class="status-bar__session">duckoder</span>
      <label class="board-field">
        <span data-text="boardLabel"></span>
        <select id="board-select" class="board-field__select"></select>
      </label>
      <button type="button" id="clear-conversation" class="terminal-button" data-shortcut="l">
        <span data-text="clearConversation"></span>
      </button>
      <button
        type="button"
        id="show-board"
        class="terminal-button"
        data-shortcut="p"
        aria-controls="board-pane"
        aria-expanded="false"
      >
        <span data-text="showBoard"></span>
      </button>
    </header>

    <!-- Split like a terminal: the conversation, and the board pane beside it when open. -->
    <div class="panes">
      <div class="pane pane--conversation">
        <main class="workspace">
          <div class="transcript" id="transcript">
            <section class="motd" id="motd"></section>
            <ol class="lines" id="lines" aria-live="polite"></ol>
          </div>
          <aside class="duck" id="duck" data-mood="listening"></aside>
        </main>

        <form class="prompt" id="prompt-form">
          <div class="prompt__line">
            <span class="prompt__label" id="prompt-label" aria-hidden="true"></span>
            <label class="visually-hidden" for="request" data-text="requestLabel"></label>
            <textarea id="request" class="prompt__input" rows="1" maxlength="4000"></textarea>
          </div>
          <div class="prompt__actions">
            <span class="prompt__hint" data-text="sendHint"></span>
            <button
              type="submit"
              id="send"
              class="terminal-button terminal-button--accent"
              data-text="send"
            ></button>
          </div>
        </form>
      </div>

      <section class="pane pane--board" id="board-pane" hidden>
        <div class="pane__header">
          <p class="pane__command" id="board-pane-command"></p>
          <button
            type="button"
            id="close-board"
            class="terminal-button"
            data-text="closeBoard"
          ></button>
        </div>
        <div class="pane__body" id="board-pane-body"></div>
      </section>
    </div>

    <dialog class="confirm-dialog" id="clear-dialog" aria-labelledby="clear-dialog-title">
      <form method="dialog" class="confirm-dialog__form">
        <p class="confirm-dialog__title" id="clear-dialog-title" data-text="clearDialogTitle"></p>
        <p data-text="clearDialogMessage"></p>
        <div class="confirm-dialog__actions">
          <span class="confirm-dialog__hint" data-text="clearDialogHint"></span>
          <button value="cancel" class="terminal-button" data-text="cancel"></button>
          <button
            value="confirm"
            class="terminal-button terminal-button--accent"
            data-text="clear"
            autofocus
          ></button>
        </div>
      </form>
    </dialog>
  </body>
</html>
